<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <!-- Background -->
  <rect width="400" height="600" fill="#00274C"/>
  
  <!-- Header stripe -->
  <rect width="400" height="80" fill="#FFCB05"/>
  
  <!-- College Name -->
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00274C">MAHANT BACHITTAR SINGH</text>
  <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00274C">COLLEGE OF ENGINEERING &amp; TECHNOLOGY</text>
  
  <!-- Logo placeholder circle -->
  <circle cx="200" cy="140" r="50" fill="#1E406B" stroke="#FFCB05" stroke-width="3"/>
  <text x="200" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFCB05">MBSCET</text>
  <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Est. 1999</text>
  
  <!-- Divider -->
  <line x1="50" y1="210" x2="350" y2="210" stroke="#FFCB05" stroke-width="2"/>
  
  <!-- Contact Information -->
  <text x="200" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFCB05">CONTACT INFORMATION</text>
  
  <!-- Address -->
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Babliana, Jammu - 180015</text>
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Jammu &amp; Kashmir, India</text>
  
  <!-- Phone -->
  <text x="200" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Landline: 0191-2970136</text>
  <text x="200" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Principal: 9419130136</text>
  
  <!-- Email -->
  <text x="200" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Email: info@mbscet.edu.in</text>
  <text x="200" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Web: www.mbscet.edu.in</text>
  
  <!-- Divider -->
  <line x1="50" y1="430" x2="350" y2="430" stroke="#FFCB05" stroke-width="2"/>
  
  <!-- Accreditations -->
  <text x="200" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFCB05">ACCREDITATIONS</text>
  
  <!-- Accreditation badges -->
  <rect x="80" y="475" width="100" height="25" rx="3" fill="#1E406B"/>
  <text x="130" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">NBA ACCREDITED</text>
  
  <rect x="220" y="475" width="100" height="25" rx="3" fill="#1E406B"/>
  <text x="270" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">AICTE APPROVED</text>
  
  <!-- Programs -->
  <text x="200" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B.Tech Programs: CSE, IT, ECE, EE, ME, Civil</text>
  <text x="200" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Affiliated to University of Jammu</text>
  
  <!-- Footer -->
  <rect y="570" width="400" height="30" fill="#FFCB05"/>
  <text x="200" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00274C">NAAC Accredited • Sikh Minority Institution</text>
</svg>
